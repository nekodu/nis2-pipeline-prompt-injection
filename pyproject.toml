[project]
name = "injbench"
version = "0.1.0"
description = "Measuring indirect prompt injection in a SIEM-to-LLM incident reporting pipeline"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
injbench = "injbench.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/injbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
